version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: codesight_db
    environment:
      POSTGRES_DB: codesight
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codesight_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock # Required for sandbox to spin up siblings
    environment:
      - DATABASE_URL=postgresql://admin:password@postgres:5432/codesight
      - ENV=development
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
